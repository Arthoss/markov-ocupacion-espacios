{% extends "base.html" %}

{% block title %}{% if object %}Editar{% else %}Crear{% endif %} escenario{% endblock %}

{% block content %}
    <h2>{% if object %}Editar{% else %}Crear{% endif %} escenario</h2>
    <form method="post" class="tarjeta formulario">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="boton" type="submit">Guardar</button>
    </form>
    <p><a href="{% url 'ocupacion:lista' %}">Volver a la lista</a></p>
{% endblock %}
