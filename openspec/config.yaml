schema: spec-driven

context: |
  Proyecto académico (Ingeniería de Software): aplicación web que usa
  cadenas de Markov para predecir la ocupación de espacios académicos
  (salones, laboratorios) por franjas horarias.
  Estados por defecto: Libre, Medio, Lleno (mínimo 3 estados).

  Stack:
  - Python 3 + Django (monolito con plantillas)
  - NumPy para el cálculo matricial
  - Chart.js para las gráficas
  - SQLite como base de datos
  - pytest + pytest-django para pruebas automatizadas

  Convenciones:
  - Código, nombres de variables y comentarios en español
  - La lógica de Markov va en un módulo puro (markov/core.py), sin depender de Django
  - Commits con Conventional Commits (feat, fix, test, docs, chore)

rules:
  specs:
    - Cada requisito debe tener al menos un escenario Given/When/Then
  tasks:
    - Cada tarea de lógica debe incluir su prueba automatizada